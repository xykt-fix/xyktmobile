<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XYKTMOBILE PLAY OTT</title>
    <!-- Include HLS.js Library for Browser Compatibility -->
    <script src="https://jsdelivr.net"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #121212; color: #fff; display: flex; height: 100vh; overflow: hidden; }
        
        /* App Layout Structure */
        .sidebar { width: 320px; background: #1e1e1e; border-right: 1px solid #2d2d2d; display: flex; flex-direction: column; height: 100%; }
        .main-content { flex: 1; display: flex; flex-direction: column; background: #000; justify-content: center; align-items: center; position: relative; }
        
        /* Sidebar Styles */
        .brand { padding: 20px; font-size: 1.2rem; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; color: #00e676; border-bottom: 1px solid #2d2d2d; }
        .channel-list { flex: 1; overflow-y: auto; padding: 10px; }
        .category-title { font-size: 0.8rem; text-transform: uppercase; color: #888; letter-spacing: 1px; margin: 15px 5px 5px 5px; }
        .channel-item { display: flex; align-items: center; padding: 12px; margin-bottom: 5px; background: #262626; border-radius: 6px; cursor: pointer; transition: background 0.2s; border: 1px solid transparent; }
        .channel-item:hover { background: #333; }
        .channel-item.active { background: #1b5e20; border-color: #00e676; }
        .channel-name { font-size: 0.95rem; font-weight: 500; }
        
        /* Player Styles */
        video { width: 100%; height: 100%; max-height: 100vh; background: #000; object-fit: contain; }
        .video-error { position: absolute; color: #ff5252; font-weight: bold; background: rgba(0,0,0,0.8); padding: 15px; border-radius: 5px; display: none; }
    </style>
</head>
<body>

    <!-- Sidebar Navigation -->
    <div class="sidebar">
        <div class="brand">XYKTMOBILE OTT</div>
        <div class="channel-list" id="channelsContainer"></div>
    </div>

    <!-- Video Canvas Frame -->
    <div class="main-content">
        <video id="videoPlayer" controls autoplay playsinline></video>
        <div class="video-error" id="videoError">Stream loading error. Check connection source.</div>
    </div>

    <script>
        // Formatted IPTV Database directly from your M3U source strings
        const playlistData = [
            { name: "S Corby", category: "Children / Infantil", url: "https://xyktmobile00.s.gy/SPLAY_CORBY/0.ts" },
            { name: "S Metro", category: "Children / Infantil", url: "https://xyktmobile00.s.gy/SPLAY_METRO/0.ts" },
            { name: "S Music & Comedy", category: "Children / Infantil", url: "https://xyktmobile00.s.gy/SPLAY_MUSICCOM/0.ts" },
            { name: "S Premium", category: "Children / Infantil", url: "https://xyktmobile00.s.gy/SPLAY_PREM/0.ts" },
            { name: "S Free", category: "Children / Infantil", url: "https://xyktmobile00.s.gy/SPLAY_1/15.ts" },
            { name: "S Corea", category: "Children / Infantil", url: "https://xyktmobile00.s.gy/SPLAY_KP/30.ts" },
            { name: "S Play Event", category: "Children / Infantil", url: "https://xyktmobile00.s.gy/SPLAY_LIVEPLUS/25.ts" },
            { name: "Cartoon Channel", category: "Children / Infantil", url: "https://xyktmobile00.s.gy/SPLAY_DISK/92.ts" },
            { name: "New Channel Pop", category: "Music / Musica", url: "https://xyktmobile00.s.gy/SPLAY_NCP/60.ts" },
            { name: "New Channel", category: "Music / Musica", url: "https://xyktmobile00.s.gy/SPLAY_NCTV/44.ts" },
            { name: "TRT WORLD", category: "News / Noticias", url: "https://xyktmobile00.s.gy/SPLAY_DISK/135.ts" },
            { name: "Daystar ESP", category: "News / Noticias", url: "https://xyktmobile00.s.gy/SPLAY-DISK/1.ts" }
        ];

        const video = document.getElementById('videoPlayer');
        const errorAlert = document.getElementById('videoError');
        let hls = null;

        // Group channels by category and populate the UI layout
        function buildChannelList() {
            const container = document.getElementById('channelsContainer');
            const categories = {};

            playlistData.forEach(ch => {
                if (!categories[ch.category]) categories[ch.category] = [];
                categories[ch.category].push(ch);
            });

            for (const cat in categories) {
                const title = document.createElement('div');
                title.className = 'category-title';
                title.innerText = cat;
                container.appendChild(title);

                categories[cat].forEach(ch => {
                    const item = document.createElement('div');
                    item.className = 'channel-item';
                    item.innerHTML = `<span class="channel-name">${ch.name}</span>`;
                    item.onclick = () => playStream(ch.url, item);
                    container.appendChild(item);
                });
            }
        }

        // Adaptive Engine to swap live stream targets securely
        function playStream(url, element) {
            errorAlert.style.display = 'none';
            
            // Manage dynamic highlighting active states
            document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
            if(element) element.classList.add('active');

            // Tear down running processes to prevent engine pipeline leaks
            if (hls) {
                hls.destroy();
            }

            // Fallback framework check for native streaming (Safari Mac/iOS) vs. Hls.js extension (Chrome/Firefox)
            if (Hls.isSupported()) {
                hls = new Hls({
                    maxBufferLength: 10,
                    liveSyncDurationCount: 3
                });
                hls.loadSource(url);
                hls.attachMedia(video);
                hls.on(Hls.Events.ERROR, function (event, data) {
                    if (data.fatal) {
                        errorAlert.style.display = 'block';
                    }
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = url;
                video.addEventListener('error', () => {
                    errorAlert.style.display = 'block';
                });
            }
        }

        // Initialize application and boot up default starting index profile
        buildChannelList();
        const firstChannel = document.querySelector('.channel-item');
        if (firstChannel) firstChannel.click();
    </script>
</body>
</html>
